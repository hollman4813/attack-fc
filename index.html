<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATTACK F.C.</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7;
    --bg2: #ffffff;
    --bg3: #f0f2f5;
    --card: #ffffff;
    --border: #e4e8ee;
    --skyblue: #1a7abf;
    --text: #222831;
    --muted: #8895a7;
    --win: #43a047;
    --lose: #e53935;
    --draw: #757575;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; min-height:100vh; font-size:14px; }

  header { background:#fff; border-bottom:1px solid var(--border); padding:0 16px; position:sticky; top:0; z-index:100; height:56px; display:flex; align-items:center; }
  .logo-wrap { display:flex; align-items:center; gap:10px; }
  .logo-img { width:36px; height:36px; border-radius:50%; object-fit:cover; }
  .logo-text { font-weight:700; font-size:15px; color:var(--text); }
  .logo-sub { font-size:11px; color:var(--muted); }

  .team-tab-bar { background:#fff; border-bottom:1px solid var(--border); display:flex; overflow-x:auto; position:sticky; top:56px; z-index:99; }
  .team-tab-bar::-webkit-scrollbar { display:none; }
  .team-tab { background:none; border:none; color:var(--muted); font-family:inherit; font-size:13px; font-weight:500; padding:13px 16px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all 0.15s; }
  .team-tab.active { color:var(--skyblue); border-bottom-color:var(--skyblue); font-weight:700; }



  main { max-width:480px; margin:0 auto; padding:0 0 20px; }
  .section { display:none; } .section.active { display:block; }
  .tab-section { display:none; } .tab-section.active { display:block; }

  /* HERO */
  .team-hero { background:linear-gradient(180deg,#1a3a6b,#1e4d8c); padding:20px 16px 16px; }
  .hero-main { display:flex; align-items:center; gap:14px; }
  .hero-emblem { width:64px; height:64px; border-radius:50%; object-fit:cover; }
  .hero-info .team-name { font-size:20px; font-weight:700; color:#fff; }
  .hero-info .team-sub { font-size:12px; color:rgba(255,255,255,0.6); margin-top:3px; }

  /* 다음 경기 */
  .next-match-label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin:16px 0 8px; }
  .next-match-card { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .next-match-league { padding:8px 14px; border-bottom:1px solid var(--border); font-size:11px; color:var(--muted); }
  .next-match-body { padding:14px; display:flex; align-items:center; justify-content:space-between; }
  .next-team { flex:1; text-align:center; }
  .next-team-emblem { width:40px; height:40px; border-radius:50%; background:var(--bg3); display:flex; align-items:center; justify-content:center; font-size:20px; margin:0 auto 6px; }
  .next-team-name { font-size:12px; font-weight:600; color:var(--text); }
  .next-match-center { text-align:center; flex-shrink:0; padding:0 12px; }
  .next-match-time { font-size:11px; color:var(--muted); margin-bottom:4px; }
  .next-match-vs { font-size:18px; font-weight:700; color:var(--text); }
  .next-match-date-str { font-size:11px; color:var(--muted); margin-top:4px; }
  .next-match-ground { padding:8px 14px; border-top:1px solid var(--border); font-size:11px; color:var(--muted); }

  .content-wrap { padding:0 12px; }
  .sec-header { display:flex; align-items:center; justify-content:space-between; margin:20px 0 10px; }
  .sec-title { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
  .sec-more { font-size:12px; color:var(--skyblue); background:none; border:none; font-family:inherit; cursor:pointer; }
  .divider { height:1px; background:var(--border); margin:16px 0; }

  /* 폼 카드 */
  .form-strip { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .form-strip::-webkit-scrollbar { display:none; }
  .form-card { flex-shrink:0; background:#fff; border:1px solid #e0e0e0; border-radius:10px; width:72px; overflow:hidden; }
  .form-card-score { padding:10px 6px; text-align:center; }
  .score-txt { font-size:16px; font-weight:700; color:#111; }
  .opp-txt { font-size:10px; color:#888; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .form-card-result { padding:5px 0; text-align:center; font-size:12px; font-weight:700; }
  .form-card-result.win { background:#43a047; color:#fff; }
  .form-card-result.lose { background:#e53935; color:#fff; }
  .form-card-result.draw { background:#9e9e9e; color:#fff; }

  /* 시즌 통계 */
  .stats-summary-card { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .stats-summary-row { display:flex; }
  .stats-summary-item { flex:1; padding:14px 8px; text-align:center; border-right:1px solid var(--border); }
  .stats-summary-item:last-child { border-right:none; }
  .s-val { font-size:22px; font-weight:700; color:var(--text); line-height:1; }
  .s-lbl { font-size:10px; color:var(--muted); margin-top:4px; }
  .stats-summary-item.hl .s-val { color:var(--skyblue); }
  .wdl-bar-wrap { padding:14px; border-top:1px solid var(--border); }
  .wdl-bar-labels { display:flex; justify-content:space-between; margin-bottom:6px; }
  .wdl-bar-label { font-size:11px; color:var(--muted); }
  .wdl-bar { display:flex; border-radius:4px; overflow:hidden; height:6px; }
  .w-bar { background:var(--win); } .d-bar { background:var(--draw); } .l-bar { background:var(--lose); }
  .wdl-bar-nums { display:flex; justify-content:space-between; margin-top:6px; }
  .wdl-num { font-size:13px; font-weight:700; }
  .wdl-num.w { color:var(--win); } .wdl-num.d { color:var(--draw); } .wdl-num.l { color:var(--lose); }

  /* TOP3 RANK (홈) */
  .rank-list { background:#fff; border-radius:10px; overflow:hidden; border:1px solid var(--border); margin-bottom:4px; }
  .rank-item { display:flex; align-items:center; padding:12px 14px; border-bottom:1px solid var(--border); gap:12px; }
  .rank-item:last-child { border-bottom:none; }
  .rank-pos { font-size:13px; font-weight:700; color:var(--muted); width:18px; text-align:center; flex-shrink:0; }
  .rank-pos.p1 { color:#f5c842; } .rank-pos.p2 { color:#b0bec5; } .rank-pos.p3 { color:#a0785a; }
  .rank-avatar { width:34px; height:34px; border-radius:50%; background:#e8f0f8; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--skyblue); flex-shrink:0; }
  .rank-info { flex:1; }
  .rank-name { font-size:14px; font-weight:600; color:var(--text); }
  .rank-sub { font-size:11px; color:var(--muted); margin-top:1px; }
  .rank-val { font-size:22px; font-weight:700; color:var(--text); text-align:right; line-height:1; }
  .rank-val-label { font-size:10px; color:var(--muted); text-align:right; }

  /* ===== 득점순위 - FOTMOB 플레이어 통계 스타일 ===== */
  .stat-category { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:12px; }
  .stat-category-header { padding:14px 16px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .stat-category-title { font-size:14px; font-weight:700; color:var(--text); }
  .stat-category-more { font-size:12px; color:var(--skyblue); background:none; border:none; font-family:inherit; cursor:pointer; }
  .stat-players-row { display:flex; padding:14px 12px; gap:8px; }
  .stat-player-card { flex:1; text-align:center; padding:10px 6px; border-radius:8px; background:var(--bg); }
  .stat-player-card.top { background:#f0f7ff; }
  .stat-player-avatar { width:44px; height:44px; border-radius:50%; background:#e8f0f8; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:var(--skyblue); margin:0 auto 8px; }
  .stat-player-name { font-size:12px; font-weight:600; color:var(--text); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-player-val { font-size:20px; font-weight:800; color:var(--text); line-height:1; }
  .stat-player-val.top-val { color:var(--skyblue); font-size:24px; }

  /* 전체 리스트 (탭 전환 시) */
  .stat-full-list { background:#fff; border-radius:10px; overflow:hidden; border:1px solid var(--border); }
  .stat-full-header { display:grid; grid-template-columns:32px 48px 1fr 56px; padding:10px 14px; background:var(--bg3); font-size:10px; color:var(--muted); font-weight:700; letter-spacing:0.3px; border-bottom:1px solid var(--border); align-items:center; }
  .stat-full-row { display:grid; grid-template-columns:32px 48px 1fr 56px; padding:12px 14px; border-top:1px solid var(--border); align-items:center; transition:background 0.1s; }
  .stat-full-row:hover { background:var(--bg3); }
  .stat-full-rank { font-size:13px; font-weight:700; color:var(--muted); text-align:center; }
  .stat-full-rank.p1 { color:#f5c842; } .stat-full-rank.p2 { color:#b0bec5; } .stat-full-rank.p3 { color:#a0785a; }
  .stat-full-name { font-size:14px; font-weight:600; color:var(--text); }
  .stat-full-sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .stat-full-val { font-size:22px; font-weight:800; color:var(--text); text-align:right; }

  /* MOM 카드 */
  .mom-card { display:flex; align-items:center; padding:12px 14px; border-top:1px solid var(--border); gap:12px; background:#fff; }
  .mom-card:first-child { border-top:none; }
  .mom-stars { font-size:12px; letter-spacing:1px; margin-top:3px; }
  .mom-val { font-size:26px; font-weight:800; color:#f5a623; text-align:right; line-height:1; }
  .mom-val-lbl { font-size:10px; color:var(--muted); text-align:right; }

  /* 탭 */
  .tab-row { display:flex; gap:6px; margin:14px 0; overflow-x:auto; padding-bottom:2px; }
  .tab-btn { background:var(--bg3); border:1px solid var(--border); border-radius:20px; color:var(--muted); font-family:inherit; font-size:12px; font-weight:600; padding:6px 14px; cursor:pointer; white-space:nowrap; transition:all 0.15s; }
  .tab-btn.active { background:var(--skyblue); color:#fff; border-color:var(--skyblue); }

  /* 경기 탭 */
  .match-group-date { font-size:12px; font-weight:700; color:var(--muted); padding:14px 14px 8px; letter-spacing:0.3px; }
  .fixture-card { background:#fff; border-top:1px solid var(--border); padding:12px 14px; display:flex; align-items:center; gap:12px; }
  .fixture-card:last-child { border-bottom:1px solid var(--border); }
  .fixture-card:hover { background:#f8f9fb; }
  .fixture-result-badge { width:32px; height:32px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; }
  .fixture-result-badge.win { background:#e8f5e9; color:#2e7d32; }
  .fixture-result-badge.lose { background:#ffebee; color:#c62828; }
  .fixture-result-badge.draw { background:#f5f5f5; color:#616161; }
  .fixture-info { flex:1; min-width:0; }
  .fixture-teams { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
  .fixture-team-name { font-size:14px; font-weight:600; color:var(--text); }
  .fixture-vs { font-size:12px; color:var(--muted); flex-shrink:0; }
  .fixture-ground { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fixture-score { font-size:20px; font-weight:700; text-align:right; flex-shrink:0; }
  .fixture-score.win { color:#2e7d32; } .fixture-score.lose { color:#c62828; } .fixture-score.draw { color:var(--draw); }
  .fixture-upcoming { background:#f0f7ff; border-top:1px solid var(--border); padding:12px 14px; display:flex; align-items:center; gap:12px; }
  .fixture-upcoming:last-child { border-bottom:1px solid var(--border); }

  /* 스쿼드 */
  .squad-wrap { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .squad-table-header { display:grid; grid-template-columns:40px 1fr 36px 32px 40px 44px; gap:8px; padding:8px 14px; background:var(--bg3); font-size:10px; color:var(--muted); font-weight:700; letter-spacing:0.3px; border-bottom:1px solid var(--border); }
  .squad-group-title { font-size:11px; font-weight:700; color:var(--muted); padding:10px 14px 6px; background:#f8f9fb; border-top:1px solid var(--border); text-transform:uppercase; letter-spacing:0.5px; }
  .squad-row { display:grid; grid-template-columns:40px 1fr 36px 32px 40px 44px; gap:8px; padding:10px 14px; border-top:1px solid var(--border); align-items:center; background:#fff; }
  .squad-row:hover { background:#f8f9fb; }
  .squad-num { font-size:13px; font-weight:700; color:var(--muted); text-align:center; }
  .squad-name { font-size:13px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:5px; }
  .squad-status-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .squad-status-dot.injured { background:var(--lose); }
  .squad-status-dot.resting { background:var(--draw); }
  .squad-col { font-size:13px; font-weight:600; text-align:center; color:var(--text); }
  .squad-col.blue { color:var(--skyblue); font-weight:700; }

  .loading { display:flex; flex-direction:column; align-items:center; padding:60px 0; color:var(--muted); font-size:13px; gap:12px; }
  .spinner { width:26px; height:26px; border:2px solid var(--border); border-top-color:var(--skyblue); border-radius:50%; animation:spin 0.7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <img class="logo-img" src="emblem_v4.png" alt="ATTACK FC">
    <div>
      <div class="logo-text">ATTACK F.C.</div>
      <div class="logo-sub">2026 시즌</div>
    </div>
  </div>
</header>

<div class="team-tab-bar" id="team-tab-bar">
  <button class="team-tab active" onclick="switchTab('overview',this)">팀 개요</button>
  <button class="team-tab" onclick="switchTab('matches',this)">경기</button>
  <button class="team-tab" onclick="switchTab('scorers',this)">플레이어 통계</button>
  <button class="team-tab" onclick="switchTab('squad',this)">스쿼드</button>
</div>

<main>
  <div class="section active" id="home">

    <!-- 팀 개요 -->
    <div class="tab-section active" id="tab-overview">
      <div class="team-hero">
        <div class="hero-main">
          <img class="hero-emblem" src="emblem_v4.png" alt="ATTACK FC">
          <div class="hero-info">
            <div class="team-name">ATTACK F.C.</div>
            <div class="team-sub">창단 2006 · 안산시</div>
          </div>
        </div>
      </div>
      <div class="loading" id="ov-loading"><div class="spinner"></div>불러오는 중...</div>
      <div id="ov-content" style="display:none">
        <div class="content-wrap">
          <div id="next-match-wrap" style="display:none">
            <div class="next-match-label">다음 경기</div>
            <div class="next-match-card" id="next-match-card"></div>
            <div class="divider"></div>
          </div>
          <div class="sec-header"><div class="sec-title">팀 기록</div></div>
          <div class="form-strip" id="form-strip"></div>
          <div class="divider"></div>
          <div class="sec-header"><div class="sec-title">시즌 통계</div></div>
          <div class="stats-summary-card">
            <div class="stats-summary-row">
              <div class="stats-summary-item"><div class="s-val" id="s-games">-</div><div class="s-lbl">경기</div></div>
              <div class="stats-summary-item hl"><div class="s-val" id="s-goals">-</div><div class="s-lbl">득점</div></div>
              <div class="stats-summary-item"><div class="s-val" id="s-concede">-</div><div class="s-lbl">실점</div></div>
              <div class="stats-summary-item"><div class="s-val" id="s-gd">-</div><div class="s-lbl">득실차</div></div>
            </div>
            <div class="wdl-bar-wrap">
              <div class="wdl-bar-labels"><span class="wdl-bar-label">승</span><span class="wdl-bar-label">무</span><span class="wdl-bar-label">패</span></div>
              <div class="wdl-bar" id="wdl-bar"></div>
              <div class="wdl-bar-nums">
                <span class="wdl-num w" id="s-w">-</span>
                <span class="wdl-num d" id="s-d">-</span>
                <span class="wdl-num l" id="s-l">-</span>
              </div>
            </div>
          </div>
          <div class="divider"></div>
          <div class="sec-header"><div class="sec-title">득점 순위</div><button class="sec-more" onclick="switchTab('scorers',document.querySelectorAll('.team-tab')[2])">모두</button></div>
          <div class="rank-list" id="ov-goals"></div>
          <div class="sec-header"><div class="sec-title">어시스트 순위</div><button class="sec-more" onclick="switchTab('scorers',document.querySelectorAll('.team-tab')[2])">모두</button></div>
          <div class="rank-list" id="ov-assists"></div>
          <div class="sec-header"><div class="sec-title">MOM 순위</div><button class="sec-more" onclick="switchTab('scorers',document.querySelectorAll('.team-tab')[2])">모두</button></div>
          <div class="rank-list" id="ov-mom"></div>
        </div>
      </div>
    </div>

    <!-- 경기 -->
    <div class="tab-section" id="tab-matches">
      <div class="loading" id="matches-loading"><div class="spinner"></div>불러오는 중...</div>
      <div id="matches-content" style="display:none">
        <div id="matches-list"></div>
      </div>
    </div>

    <!-- 플레이어 통계 - FOTMOB 스타일 -->
    <div class="tab-section" id="tab-scorers">
      <div class="loading" id="scorers-loading"><div class="spinner"></div>불러오는 중...</div>
      <div id="scorers-content" style="display:none">
        <div class="tab-row content-wrap">
          <button class="tab-btn active" onclick="switchStatTab('overview',this)">주요 통계</button>
          <button class="tab-btn" onclick="switchStatTab('goals',this)">득점</button>
          <button class="tab-btn" onclick="switchStatTab('assists',this)">어시스트</button>
          <button class="tab-btn" onclick="switchStatTab('points',this)">공격포인트</button>
          <button class="tab-btn" onclick="switchStatTab('mom',this)">MOM</button>
        </div>
        <div class="content-wrap" id="scorers-body"></div>
      </div>
    </div>

    <!-- 스쿼드 -->
    <div class="tab-section" id="tab-squad">
      <div class="loading" id="squad-loading"><div class="spinner"></div>불러오는 중...</div>
      <div id="squad-content" style="display:none">
        <div class="content-wrap" style="padding-top:12px">
          <div class="squad-wrap" id="squad-list"></div>
        </div>
      </div>
    </div>

  </div>
  <!-- 경기 상세 페이지 -->
  <div class="section" id="match-detail">
    <div id="match-detail-content"></div>
  </div>

  <!-- 선수 상세 페이지 -->
  <div class="section" id="player-detail">
    <div id="player-detail-content"></div>
  </div>

</main>



<script>
const SUPA_URL = 'https://fboqjlzgyfewgsoxclxy.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZib3FqbHpneWZld2dzb3hjbHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3ODQ4MzIsImV4cCI6MjA5MzM2MDgzMn0.x4ima7dIQRP6q9nmCyWi0DIOOA3ZmSorjX-gE3lthiU';

const api = async path => {
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, {headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`}});
  const d = await r.json();
  return Array.isArray(d) ? d : [];
};

let allStats = [];
const loaded = {};

/* ── 팀 개요 ── */
async function loadOverview() {
  const [summary, stats, matches, upcoming] = await Promise.all([
    api('view_season_summary?select=*'),
    api('view_season_stats?select=*'),
    api('view_match_results?select=*&order=match_date.desc&limit=8'),
    api('matches?select=*&status=eq.upcoming&order=match_date.asc&limit=1')
  ]);
  allStats = stats;
  const s = summary[0] || {};

  // 다음 경기
  if (upcoming.length > 0) {
    const u = upcoming[0];
    const d = new Date(u.match_date);
    document.getElementById('next-match-card').innerHTML = `
      <div class="next-match-league">📅 예정 경기</div>
      <div class="next-match-body">
        <div class="next-team">
          <div class="next-team-emblem"><img src="emblem_v4.png" style="width:36px;height:36px;border-radius:50%;object-fit:cover"></div>
          <div class="next-team-name">ATTACK F.C.</div>
        </div>
        <div class="next-match-center">
          <div class="next-match-time">${u.match_time||''}</div>
          <div class="next-match-vs">VS</div>
          <div class="next-match-date-str">${d.getMonth()+1}월 ${d.getDate()}일</div>
        </div>
        <div class="next-team">
          <div class="next-team-emblem">⚽</div>
          <div class="next-team-name">${u.opponent}</div>
        </div>
      </div>
      <div class="next-match-ground">📍 ${u.ground||'미정'}</div>`;
    document.getElementById('next-match-wrap').style.display = 'block';
  }

  // 시즌 통계
  document.getElementById('s-games').textContent = s.총경기수||0;
  document.getElementById('s-goals').textContent = s.총득점||0;
  document.getElementById('s-concede').textContent = s.총실점||0;
  const gd = s.득실차||0;
  document.getElementById('s-gd').textContent = gd>0?`+${gd}`:gd;
  document.getElementById('s-w').textContent = s.승||0;
  document.getElementById('s-d').textContent = s.무||0;
  document.getElementById('s-l').textContent = s.패||0;
  const tot = s.총경기수||1;
  const wp = (s.승||0)/tot*100, dp = (s.무||0)/tot*100, lp = 100-wp-dp;
  document.getElementById('wdl-bar').innerHTML = `<div class="w-bar" style="width:${wp}%"></div><div class="d-bar" style="width:${dp}%"></div><div class="l-bar" style="width:${lp}%"></div>`;

  // 폼 카드
  const fin = matches.filter(m=>m.result);
  document.getElementById('form-strip').innerHTML = fin.map(m=>{
    const rc=m.result==='Win'?'win':m.result==='Lose'?'lose':'draw';
    const lbl=m.result==='Win'?'승':m.result==='Lose'?'패':'무';
    const opp=m.opponent.length>6?m.opponent.slice(0,6)+'…':m.opponent;
    return `<div class="form-card"><div class="form-card-score"><div class="score-txt">${m.our_score}:${m.opponent_score}</div><div class="opp-txt">${opp}</div></div><div class="form-card-result ${rc}">${lbl}</div></div>`;
  }).join('');

  // TOP3
  const ri = (p,i,k,lbl) => {
    const cls=['p1','p2','p3'][i]||'';
    return `<div class="rank-item"><div class="rank-pos ${cls}">${i+1}</div><div class="rank-avatar">${p.name.slice(0,1)}</div><div class="rank-info"><div class="rank-name">${p.name}</div><div class="rank-sub">#${p.number||'-'}</div></div><div><div class="rank-val">${p[k]}</div><div class="rank-val-label">${lbl}</div></div></div>`;
  };
  document.getElementById('ov-goals').innerHTML = [...stats].sort((a,b)=>b['총골']-a['총골']).slice(0,3).map((p,i)=>ri(p,i,'총골','골')).join('');
  document.getElementById('ov-assists').innerHTML = [...stats].sort((a,b)=>b['총어시스트']-a['총어시스트']).slice(0,3).map((p,i)=>ri(p,i,'총어시스트','어시스트')).join('');
  document.getElementById('ov-mom').innerHTML = [...stats].sort((a,b)=>b['mom횟수']-a['mom횟수']).filter(p=>p['mom횟수']>0).slice(0,3).map((p,i)=>ri(p,i,'mom횟수','MOM')).join('');

  document.getElementById('ov-loading').style.display='none';
  document.getElementById('ov-content').style.display='block';
}

/* ── 경기 ── */
async function loadMatches() {
  let finished = [], upcoming = [];
  try {
    [finished, upcoming] = await Promise.all([
      api('matches?select=*&status=eq.finished&order=match_date.desc'),
      api('matches?select=*&status=eq.upcoming&order=match_date.asc')
    ]);
  } catch(e) {
    console.error('경기 로드 실패:', e);
  }

  let html = '';

  if (upcoming.length > 0) {
    html += '<div class="match-group-date" style="padding-top:16px">예정 경기</div>';
    upcoming.forEach(m => {
      const d = new Date(m.match_date);
      html += `<div class="fixture-upcoming">
        <div style="width:32px;text-align:center;font-size:11px;font-weight:700;color:var(--skyblue)">VS</div>
        <div class="fixture-info">
          <div class="fixture-teams"><span class="fixture-team-name">${m.opponent}</span></div>
          <div class="fixture-ground">📅 ${d.getMonth()+1}월 ${d.getDate()}일${m.match_time?' · '+m.match_time:''} · 📍 ${m.ground||'미정'}</div>
        </div>
        <div style="font-size:13px;font-weight:700;color:var(--skyblue)">예정</div>
      </div>`;
    });
  }

  const groups = {};
  finished.forEach(m => {
    const d = new Date(m.match_date);
    const k = `${d.getFullYear()}년 ${d.getMonth()+1}월`;
    if (!groups[k]) groups[k] = [];
    groups[k].push(m);
  });

  Object.entries(groups).forEach(([month, ms]) => {
    html += `<div class="match-group-date">${month}</div>`;
    ms.forEach(m => {
      const rc = m.result==='Win'?'win':m.result==='Lose'?'lose':'draw';
      const rl = m.result==='Win'?'W':m.result==='Lose'?'L':'D';
      const d = new Date(m.match_date);
      html += `<div class="fixture-card" onclick="showMatch(${m.id})" style="cursor:pointer">
        <div class="fixture-result-badge ${rc}">${rl}</div>
        <div class="fixture-info">
          <div class="fixture-teams"><span class="fixture-team-name">ATTACK F.C.</span><span class="fixture-vs">vs</span><span class="fixture-team-name">${m.opponent}</span></div>
          <div class="fixture-ground">📅 ${d.getMonth()+1}. ${d.getDate()} · 📍 ${m.ground||'미정'}</div>
        </div>
        <div class="fixture-score ${rc}">${m.our_score} : ${m.opponent_score}</div>
      </div>`;
    });
  });

  document.getElementById('matches-list').innerHTML = html;
  document.getElementById('matches-loading').style.display = 'none';
  document.getElementById('matches-content').style.display = 'block';
}

/* ── 플레이어 통계 ── */
async function loadScorers() {
  if (!allStats.length) allStats = await api('view_season_stats?select=*');
  // photo_url 병합
  const players = await api('players?select=name,photo_url');
  const photoMap = {};
  players.forEach(p => photoMap[p.name] = p.photo_url);
  allStats = allStats.map(s => ({...s, photo_url: photoMap[s.name]||null}));
  renderStatOverview();
  document.getElementById('scorers-loading').style.display = 'none';
  document.getElementById('scorers-content').style.display = 'block';
}

function statCard(p, i, key) {
  const isTop = i === 0;
  const img = p.photo_url
    ? `<img src="${p.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    : p.name.slice(0,1);
  return `<div class="stat-player-card ${isTop?'top':''}">
    <div class="stat-player-avatar">${img}</div>
    <div class="stat-player-name">${p.name}</div>
    <div class="stat-player-val ${isTop?'top-val':''}">${p[key]}</div>
  </div>`;
}

function renderStatOverview() {
  const categories = [
    { key:'총골', label:'득점' },
    { key:'총어시스트', label:'어시스트' },
    { key:'공격포인트', label:'득점+어시스트' },
    { key:'mom횟수', label:'MOM', filter: p=>p['mom횟수']>0 }
  ];
  document.getElementById('scorers-body').innerHTML = categories.map(cat => {
    const sorted = [...allStats]
      .filter(cat.filter || (p=>p[cat.key]>0))
      .sort((a,b)=>b[cat.key]-a[cat.key])
      .slice(0,3);
    return `<div class="stat-category">
      <div class="stat-category-header">
        <div class="stat-category-title">${cat.label}</div>
        <button class="stat-category-more" onclick="switchStatTab('${cat.key==='총골'?'goals':cat.key==='총어시스트'?'assists':cat.key==='공격포인트'?'points':'mom'}', document.querySelectorAll('.tab-btn')[${categories.indexOf(cat)+1}])">모두 보기</button>
      </div>
      <div class="stat-players-row">${sorted.map((p,i)=>statCard(p,i,cat.key)).join('')}</div>
    </div>`;
  }).join('');
}

function renderStatList(tab) {
  let sorted = [...allStats].sort((a,b)=>
    tab==='goals'?b['총골']-a['총골']:
    tab==='assists'?b['총어시스트']-a['총어시스트']:
    tab==='points'?b['공격포인트']-a['공격포인트']:
    b['mom횟수']-a['mom횟수']
  );
  const key = tab==='goals'?'총골':tab==='assists'?'총어시스트':tab==='points'?'공격포인트':'mom횟수';
  const lbl = tab==='goals'?'골':tab==='assists'?'어시스트':tab==='points'?'공격P':'MOM';
  sorted = sorted.filter(p=>p[key]>0);

  if (tab === 'mom') {
    document.getElementById('scorers-body').innerHTML = `<div class="stat-full-list">
      <div class="stat-full-header"><div></div><div style="grid-column:span 2">선수</div><div style="text-align:right">MOM</div></div>
      ${sorted.map((p,i)=>{
        const img = p.photo_url
          ? `<img src="${p.photo_url}" style="width:36px;height:36px;border-radius:50%;object-fit:cover">`
          : `<div style="width:36px;height:36px;border-radius:50%;background:#e8f0f8;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--skyblue)">${p.name.slice(0,1)}</div>`;
        return `<div class="stat-full-row">
          <div style="display:flex;align-items:center;justify-content:center">${img}</div>
          <div style="display:flex;flex-direction:column;justify-content:center;grid-column:span 2">
            <div class="stat-full-name">${p.name}</div>
            <div class="stat-full-sub">#${p.number||'-'}</div>
          </div>
          <div class="stat-full-val">${p['mom횟수']}</div>
        </div>`;
      }).join('')}
    </div>`;
    return;
  }

  document.getElementById('scorers-body').innerHTML = `<div class="stat-full-list">
    <div class="stat-full-header"><div>#</div><div></div><div>선수</div><div style="text-align:right">${lbl}</div></div>
    ${sorted.map((p,i)=>{
      const cls=['p1','p2','p3'][i]||'';
      return `<div class="stat-full-row">
        <div class="stat-full-rank ${cls}">${i+1}</div>
        <div><div class="stat-full-name">${p.name}</div><div class="stat-full-sub">#${p.number||'-'}</div></div>
        <div class="stat-full-val">${p[key]}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function switchStatTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if (tab === 'overview') renderStatOverview();
  else renderStatList(tab);
}

/* ── 스쿼드 ── */
async function loadSquad() {
  const players = await api('players?select=*&order=number.asc');
  if (!allStats.length) allStats = await api('view_season_stats?select=*');
  const sm = {};
  allStats.forEach(s=>sm[s.name]=s);

  const posOrder = ['GK','DF','MF','FW'];
  const posLabel = {GK:'골키퍼',DF:'수비수',MF:'미드필더',FW:'공격수'};
  const groups = {GK:[],DF:[],MF:[],FW:[],etc:[]};
  players.forEach(p=>(p.position&&groups[p.position]?groups[p.position]:groups.etc).push(p));

  const row = p => {
    const s = sm[p.name]||{};
    const st = p.status||'active';
    const stMap = {active:'-',injured:'부상',resting:'휴식'};
    const dot = st!=='active'?`<span class="squad-status-dot ${st}"></span>`:'';
    // 나이 계산
    let age = '-';
    if (p.birth_date) {
      const today = new Date();
      const birth = new Date(p.birth_date);
      age = today.getFullYear() - birth.getFullYear();
      if (today.getMonth() < birth.getMonth() || (today.getMonth() === birth.getMonth() && today.getDate() < birth.getDate())) age--;
    }
    const photoEl = p.photo_url
      ? `<img src="${p.photo_url}" style="width:36px;height:36px;border-radius:50%;object-fit:cover">`
      : `<div style="width:36px;height:36px;border-radius:50%;background:#e8f0f8;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--skyblue)">${p.name.slice(0,1)}</div>`;
    const stColor = st==='injured'?'var(--lose)':st==='resting'?'var(--draw)':'var(--muted)';
    const stBg = st==='injured'?'#ffebee':st==='resting'?'#fff8e1':'#f5f5f5';
    const stPill = st!=='active'
      ? `<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:${stBg};color:${stColor}">${stMap[st]}</span>`
      : `<span style="font-size:10px;color:var(--muted)">-</span>`;
    return `<div class="squad-row" onclick="showPlayer(${p.id})" style="cursor:pointer">
      <div style="display:flex;align-items:center;justify-content:center">${photoEl}</div>
      <div>
        <div style="font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:4px">${dot}${p.name}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${p.position||'-'}</div>
      </div>
      <div class="squad-col" style="font-size:13px;font-weight:700;color:var(--muted)">${p.number}</div>
      <div class="squad-col" style="font-size:12px">${age}</div>
      <div class="squad-col" style="font-size:12px">${p.height?p.height+'cm':'-'}</div>
      <div class="squad-col">${stPill}</div>
    </div>`;
  };

  let html = `<div class="squad-table-header"><div></div><div>이름</div><div style="text-align:center">#</div><div style="text-align:center">나이</div><div style="text-align:center">키</div><div style="text-align:center">상태</div></div>`;
  posOrder.forEach(pos=>{
    if(!groups[pos].length) return;
    html += `<div class="squad-group-title">${posLabel[pos]}</div>${groups[pos].map(row).join('')}`;
  });
  if (groups.etc.length) html += `<div class="squad-group-title">기타</div>${groups.etc.map(row).join('')}`;

  document.getElementById('squad-list').innerHTML = html;
  document.getElementById('squad-loading').style.display = 'none';
  document.getElementById('squad-content').style.display = 'block';
}

/* ── 탭 전환 ── */
function switchTab(tab, btn) {
  document.querySelectorAll('.team-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-section').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  if (!loaded[tab]) {
    loaded[tab] = true;
    if (tab==='matches') loadMatches();
    if (tab==='scorers') loadScorers();
    if (tab==='squad') loadSquad();
  }
}

        <div style="padding:14px;text-align:center">
          <div style="font-size:14px;font-weight:600;color:var(--text)">${footMap[p.dominant_foot]||'-'}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:3px">주발</div>
        </div>
      </div>
    </div>

    <!-- 시즌 통계 -->
    <div style="padding:0 12px;margin-top:20px">
      <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">2026 시즌 통계</div>
      <div style="background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden">
        <div style="display:grid;grid-template-columns:repeat(3,1fr)">
          <div style="padding:16px;text-align:center;border-right:1px solid var(--border)">
            <div style="font-size:26px;font-weight:800;color:var(--skyblue)">${s['총골']||0}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:4px">골</div>
          </div>
          <div style="padding:16px;text-align:center;border-right:1px solid var(--border)">
            <div style="font-size:26px;font-weight:800;color:var(--skyblue)">${s['총어시스트']||0}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:4px">어시스트</div>
          </div>
          <div style="padding:16px;text-align:center">
            <div style="font-size:26px;font-weight:800;color:#f5a623">${s['mom횟수']||0}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:4px">MOM</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 경기별 기록 -->
    <div style="padding:0 12px;margin-top:20px;padding-bottom:20px">
      <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">경기 기록</div>
      <div style="background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden">
        <div style="display:grid;grid-template-columns:1fr 44px 36px 36px 44px;gap:8px;padding:10px 16px;background:var(--bg3);font-size:10px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border)">
          <div>상대팀</div><div style="text-align:center">결과</div><div style="text-align:center">G</div><div style="text-align:center">A</div><div style="text-align:center">MOM</div>
        </div>
        ${matchRows || '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">기록 없음</div>'}
      </div>
    </div>
  `;
}

/* ── 경기 상세 페이지 ── */
async function showMatch(matchId) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('match-detail').classList.add('active');
  document.getElementById('team-tab-bar').style.display = 'none';
  document.getElementById('match-detail-content').innerHTML = '<div class="loading"><div class="spinner"></div>불러오는 중...</div>';

  const [matches, stats] = await Promise.all([
    api(`matches?select=*&id=eq.${matchId}`),
    api(`match_stats?select=*,players(name,number,photo_url,position)&match_id=eq.${matchId}`)
  ]);

  const m = matches[0];
  if (!m) return;

  const d = new Date(m.match_date);
  const dateStr = `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}`;
  const rc = m.result==='Win'?'win':m.result==='Lose'?'lose':'draw';
  const rlKo = m.result==='Win'?'승':m.result==='Lose'?'패':'무';
  const rcColor = rc==='win'?'#2e7d32':rc==='lose'?'#c62828':'#616161';
  const rcBg = rc==='win'?'#e8f5e9':rc==='lose'?'#ffebee':'#f5f5f5';

  // 득점자
  const scorers = stats.filter(s=>s.goals>0).sort((a,b)=>b.goals-a.goals);
  // 어시스트
  const assisters = stats.filter(s=>s.assists>0).sort((a,b)=>b.assists-a.assists);
  // MOM
  const mom = stats.find(s=>s.is_mom);

  const playerRow = (s, statKey, statLabel) => {
    const p = s.players||{};
    const photo = p.photo_url
      ? `<img src="${p.photo_url}" style="width:36px;height:36px;border-radius:50%;object-fit:cover">`
      : `<div style="width:36px;height:36px;border-radius:50%;background:#e8f0f8;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--skyblue)">${(p.name||'?').slice(0,1)}</div>`;
    return `<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border)">
      ${photo}
      <div style="flex:1">
        <div style="font-size:14px;font-weight:600;color:var(--text)">${p.name||'-'}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">#${p.number||'-'} · ${p.position||'-'}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:20px;font-weight:800;color:var(--skyblue)">${s[statKey]}</div>
        <div style="font-size:10px;color:var(--muted)">${statLabel}</div>
      </div>
    </div>`;
  };

  const momHtml = mom ? (() => {
    const p = mom.players||{};
    const photo = p.photo_url
      ? `<img src="${p.photo_url}" style="width:36px;height:36px;border-radius:50%;object-fit:cover">`
      : `<div style="width:36px;height:36px;border-radius:50%;background:#fff8e1;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#f5a623">${(p.name||'?').slice(0,1)}</div>`;
    return `<div style="display:flex;align-items:center;gap:12px;padding:12px 16px">
      ${photo}
      <div style="flex:1">
        <div style="font-size:14px;font-weight:600;color:var(--text)">${p.name||'-'}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">#${p.number||'-'}</div>
      </div>
      <div style="font-size:20px">⭐</div>
    </div>`;
  })() : '<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">없음</div>';

  document.getElementById('match-detail-content').innerHTML = `
    <!-- 헤더 -->
    <div style="background:linear-gradient(180deg,#1a3a6b,#1e4d8c);padding:20px 16px">
      <button onclick="backToMatches()" style="background:none;border:none;color:rgba(255,255,255,0.8);font-size:13px;cursor:pointer;padding:0;margin-bottom:16px;display:flex;align-items:center;gap:4px;font-family:inherit">← 뒤로</button>
      <div style="text-align:center">
        <div style="font-size:11px;color:rgba(255,255,255,0.6);margin-bottom:12px">${dateStr} · ${m.ground||'미정'}</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:16px">
          <div style="flex:1;text-align:right">
            <div style="font-size:13px;font-weight:600;color:#fff">ATTACK F.C.</div>
            <img src="emblem_v4.png" style="width:44px;height:44px;border-radius:50%;margin-top:6px">
          </div>
          <div style="text-align:center;min-width:80px">
            <div style="font-size:32px;font-weight:800;color:#fff;letter-spacing:2px">${m.our_score} : ${m.opponent_score}</div>
            <span style="font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px;background:${rcBg};color:${rcColor};margin-top:6px;display:inline-block">${rlKo}</span>
          </div>
          <div style="flex:1;text-align:left">
            <div style="font-size:13px;font-weight:600;color:#fff">${m.opponent}</div>
            <div style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:20px;margin-top:6px">⚽</div>
          </div>
        </div>
      </div>
    </div>

    <div style="padding:0 12px 24px">
      <!-- 득점 -->
      <div style="margin-top:20px">
        <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">득점</div>
        <div style="background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden">
          ${scorers.length ? scorers.map(s=>playerRow(s,'goals','골')).join('') : '<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">기록 없음</div>'}
        </div>
      </div>

      <!-- 어시스트 -->
      <div style="margin-top:16px">
        <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">어시스트</div>
        <div style="background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden">
          ${assisters.length ? assisters.map(s=>playerRow(s,'assists','어시스트')).join('') : '<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">기록 없음</div>'}
        </div>
      </div>

      <!-- MOM -->
      <div style="margin-top:16px">
        <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">MOM</div>
        <div style="background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden">
          ${momHtml}
        </div>
      </div>
    </div>
  `;
}

function backToMatches() {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('home').classList.add('active');
  document.getElementById('team-tab-bar').style.display = 'flex';
  document.querySelectorAll('.team-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.team-tab')[1].classList.add('active');
  document.getElementById('tab-matches').classList.add('active');
}

function backToSquad() {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('home').classList.add('active');
  document.getElementById('team-tab-bar').style.display = 'flex';
  // 스쿼드 탭으로 복귀
  document.querySelectorAll('.team-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.team-tab')[3].classList.add('active');
  document.getElementById('tab-squad').classList.add('active');
}
</script>
</body>
</html>
