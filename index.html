<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATTACK F.C.</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7;
    --bg2: #ffffff;
    --bg3: #f0f2f5;
    --card: #ffffff;
    --border: #e4e8ee;
    --navy: #1a3a6b;
    --skyblue: #1a7abf;
    --gold: #c9a84c;
    --white: #ffffff;
    --text: #222831;
    --muted: #8895a7;
    --win: #43a047;
    --lose: #e53935;
    --draw: #757575;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; min-height:100vh; font-size:14px; }

  /* HEADER */
  header { background:#ffffff; border-bottom:1px solid #e4e8ee; padding:0 16px; position:sticky; top:0; z-index:100; height:56px; display:flex; align-items:center; }
  .logo-wrap { display:flex; align-items:center; gap:10px; }
  .logo-img { width:36px; height:36px; border-radius:50%; object-fit:cover; }
  .logo-text { font-weight:700; font-size:15px; color:#222831; }
  .logo-sub { font-size:11px; color:#8895a7; }

  /* TEAM TAB BAR - FOTMOB 스타일 */
  .team-tab-bar { background:#ffffff; border-bottom:1px solid var(--border); display:flex; overflow-x:auto; position:sticky; top:56px; z-index:99; }
  .team-tab-bar::-webkit-scrollbar { display:none; }
  .team-tab { background:none; border:none; color:#8895a7; font-family:inherit; font-size:13px; font-weight:500; padding:13px 16px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all 0.15s; }
  .team-tab.active { color:#1a7abf; border-bottom-color:#1a7abf; font-weight:700; }

  /* BOTTOM NAV */
  .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#ffffff; border-top:1px solid var(--border); display:flex; z-index:100; height:56px; }
  .bottom-nav button { flex:1; background:none; border:none; color:var(--muted); font-family:inherit; font-size:10px; font-weight:500; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; transition:color 0.2s; }
  .bottom-nav button .nav-icon { font-size:20px; }
  .bottom-nav button.active { color:#1a7abf; }

  main { max-width:480px; margin:0 auto; padding:0 0 70px; }
  .section { display:none; }
  .section.active { display:block; }
  .tab-section { display:none; }
  .tab-section.active { display:block; }

  /* TEAM HERO - FOTMOB 스타일 */
  .team-hero { background:linear-gradient(180deg, #1a3a6b 0%, #1e4d8c 100%); padding:20px 16px 16px; }
  .hero-main { display:flex; align-items:center; gap:14px; }
  .hero-emblem { width:64px; height:64px; border-radius:50%; object-fit:cover; }
  .hero-info .team-name { font-size:20px; font-weight:700; color:var(--white); }
  .hero-info .team-sub { font-size:12px; color:var(--muted); margin-top:3px; }

  /* 다음 경기 카드 - FOTMOB 스타일 */
  .next-match-wrap { padding:0 12px; margin-bottom:4px; }
  .next-match-label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin:16px 0 8px; }
  .next-match-card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .next-match-league { padding:8px 14px; border-bottom:1px solid var(--border); font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .next-match-body { padding:14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .next-team { flex:1; text-align:center; }
  .next-team-emblem { width:40px; height:40px; border-radius:50%; background:var(--bg3); display:flex; align-items:center; justify-content:center; font-size:20px; margin:0 auto 6px; }
  .next-team-name { font-size:12px; font-weight:600; color:#222831; }
  .next-match-center { text-align:center; flex-shrink:0; }
  .next-match-time { font-size:11px; color:var(--muted); margin-bottom:4px; }
  .next-match-date { font-size:16px; font-weight:700; color:#222831; }
  .next-match-ground { padding:8px 14px; border-top:1px solid var(--border); font-size:11px; color:var(--muted); }

  /* SECTION */
  .content-wrap { padding:0 12px; }
  .sec-header { display:flex; align-items:center; justify-content:space-between; margin:20px 0 10px; }
  .sec-title { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
  .sec-more { font-size:12px; color:var(--skyblue); cursor:pointer; background:none; border:none; font-family:inherit; }

  /* 팀 기록 폼 카드 */
  .form-strip { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .form-strip::-webkit-scrollbar { display:none; }
  .form-card { flex-shrink:0; background:#ffffff; border:1px solid #e0e0e0; border-radius:10px; width:72px; overflow:hidden; }
  .form-card-score { padding:10px 6px; text-align:center; }
  .form-card-score .score-txt { font-size:16px; font-weight:700; color:#111; }
  .form-card-score .opp-txt { font-size:10px; color:#888; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .form-card-result { padding:5px 0; text-align:center; font-size:12px; font-weight:700; }
  .form-card-result.win { background:#43a047; color:#fff; }
  .form-card-result.lose { background:#e53935; color:#fff; }
  .form-card-result.draw { background:#9e9e9e; color:#fff; }

  /* 시즌 통계 */
  .stats-summary-card { background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:4px; }
  .stats-summary-row { display:flex; }
  .stats-summary-item { flex:1; padding:14px 8px; text-align:center; border-right:1px solid var(--border); }
  .stats-summary-item:last-child { border-right:none; }
  .stats-summary-item .s-val { font-size:22px; font-weight:700; color:#222831; line-height:1; }
  .stats-summary-item .s-lbl { font-size:10px; color:var(--muted); margin-top:4px; }
  .stats-summary-item.highlight .s-val { color:#1a7abf; }
  .wdl-bar-wrap { padding:14px; border-top:1px solid var(--border); }
  .wdl-bar-labels { display:flex; justify-content:space-between; margin-bottom:6px; }
  .wdl-bar-label { font-size:11px; color:var(--muted); }
  .wdl-bar { display:flex; border-radius:4px; overflow:hidden; height:6px; }
  .wdl-bar .w-bar { background:var(--win); }
  .wdl-bar .d-bar { background:var(--draw); }
  .wdl-bar .l-bar { background:var(--lose); }
  .wdl-bar-nums { display:flex; justify-content:space-between; margin-top:6px; }
  .wdl-num { font-size:13px; font-weight:700; }
  .wdl-num.w { color:var(--win); }
  .wdl-num.d { color:var(--draw); }
  .wdl-num.l { color:var(--lose); }

  /* RANK LIST */
  .rank-list { background:var(--card); border-radius:10px; overflow:hidden; border:1px solid var(--border); margin-bottom:4px; }
  .rank-item { display:flex; align-items:center; padding:12px 14px; border-bottom:1px solid var(--border); gap:12px; }
  .rank-item:last-child { border-bottom:none; }
  .rank-pos { font-size:13px; font-weight:700; color:var(--muted); width:18px; text-align:center; flex-shrink:0; }
  .rank-pos.p1 { color:#f5c842; }
  .rank-pos.p2 { color:#b0bec5; }
  .rank-pos.p3 { color:#a0785a; }
  .rank-avatar { width:34px; height:34px; border-radius:50%; background:#e8f0f8; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#1a7abf; flex-shrink:0; }
  .rank-info { flex:1; }
  .rank-name { font-size:14px; font-weight:600; color:#222831; }
  .rank-sub { font-size:11px; color:var(--muted); margin-top:1px; }
  .rank-val { font-size:22px; font-weight:700; color:#222831; text-align:right; line-height:1; }
  .rank-val-label { font-size:10px; color:var(--muted); text-align:right; }

  /* MATCH CARD */
  .match-card { background:var(--card); border-radius:10px; margin-bottom:8px; overflow:hidden; border:1px solid var(--border); }
  .match-card-header { padding:8px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:#f8f9fb; }
  .match-date-text { font-size:11px; color:var(--muted); }
  .match-result-pill { font-size:10px; font-weight:700; padding:2px 10px; border-radius:4px; }
  .match-result-pill.win { background:var(--win); color:#fff; }
  .match-result-pill.lose { background:var(--lose); color:#fff; }
  .match-result-pill.draw { background:var(--draw); color:#fff; }
  .match-card-body { padding:14px; display:flex; align-items:center; justify-content:space-between; }
  .match-team { font-size:13px; font-weight:600; flex:1; color:#222831; }
  .match-team.right { text-align:right; }
  .match-team.ours { color:var(--white); }
  .match-score { font-size:22px; font-weight:700; color:#222831; text-align:center; min-width:72px; letter-spacing:2px; }
  .match-ground { padding:7px 14px; font-size:11px; color:var(--muted); border-top:1px solid var(--border); }

  /* TABS */
  .tab-row { display:flex; gap:6px; margin:14px 0; overflow-x:auto; padding-bottom:2px; }
  .tab-btn { background:var(--bg3); border:1px solid var(--border); border-radius:20px; color:var(--muted); font-family:inherit; font-size:12px; font-weight:600; padding:6px 14px; cursor:pointer; white-space:nowrap; transition:all 0.15s; }
  .tab-btn.active { background:#1a7abf; color:#fff; border-color:#1a7abf; }

  /* FULL TABLE */
  .full-table { background:var(--card); border-radius:10px; overflow:hidden; border:1px solid var(--border); }
  .full-table-header { display:grid; padding:10px 14px; background:#f0f2f5; font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; grid-template-columns:24px 1fr 36px 36px 46px 46px; gap:6px; border-bottom:1px solid var(--border); }
  .full-table-row { display:grid; padding:11px 14px; border-top:1px solid var(--border); grid-template-columns:24px 1fr 36px 36px 46px 46px; gap:6px; align-items:center; }
  .full-table-row:hover { background:var(--bg3); }
  .col-name { font-weight:600; font-size:13px; color:#222831; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .col-num { font-size:14px; font-weight:600; text-align:center; color:var(--text); }
  .col-num.highlight { color:var(--skyblue); font-size:18px; font-weight:700; }

  /* PLAYER CARD */
  .player-card { background:var(--card); border-radius:10px; border:1px solid var(--border); margin-bottom:8px; display:flex; align-items:center; padding:12px 14px; gap:12px; }
  .player-card:hover { background:var(--bg3); }
  .player-num-badge { width:36px; height:36px; background:#e8f0f8; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#1a7abf; flex-shrink:0; }
  .player-info { flex:1; }
  .player-name { font-size:14px; font-weight:600; color:#222831; }
  .player-meta { font-size:11px; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:4px; }
  .player-stats-mini { display:flex; gap:14px; text-align:center; }
  .mini-stat .v { font-size:15px; font-weight:700; color:var(--white); }
  .mini-stat .l { font-size:10px; color:var(--muted); }
  .status-dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
  .status-dot.active { background:var(--win); }
  .status-dot.injured { background:var(--lose); }
  .status-dot.resting { background:var(--draw); }

  .loading { display:flex; flex-direction:column; align-items:center; padding:60px 0; color:var(--muted); font-size:13px; gap:12px; }
  .spinner { width:26px; height:26px; border:2px solid var(--border); border-top-color:#1a7abf; border-radius:50%; animation:spin 0.7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .mom-tag { background:rgba(26,122,191,0.12); color:#1a7abf; font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; }
  .divider { height:1px; background:var(--border); margin:16px 0; }

  /* FOTMOB 경기 리스트 스타일 */
  .match-group { margin-bottom:4px; }
  .match-group-date { font-size:12px; font-weight:700; color:var(--muted); padding:14px 14px 8px; text-transform:uppercase; letter-spacing:0.3px; }
  .fixture-card { background:#fff; border-top:1px solid var(--border); padding:12px 14px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:background 0.1s; }
  .fixture-card:last-child { border-bottom:1px solid var(--border); }
  .fixture-card:hover { background:#f8f9fb; }
  .fixture-result-badge { width:32px; height:32px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; }
  .fixture-result-badge.win { background:#e8f5e9; color:#2e7d32; }
  .fixture-result-badge.lose { background:#ffebee; color:#c62828; }
  .fixture-result-badge.draw { background:#f5f5f5; color:#616161; }
  .fixture-info { flex:1; min-width:0; }
  .fixture-teams { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
  .fixture-team-name { font-size:14px; font-weight:600; color:#222831; }
  .fixture-vs { font-size:12px; color:var(--muted); flex-shrink:0; }
  .fixture-ground { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fixture-score { font-size:20px; font-weight:700; color:#222831; text-align:right; flex-shrink:0; letter-spacing:1px; }
  .fixture-score.win { color:#2e7d32; }
  .fixture-score.lose { color:#c62828; }
  .fixture-upcoming { background:#f0f7ff; border-top:1px solid var(--border); padding:12px 14px; display:flex; align-items:center; gap:12px; }
  .fixture-upcoming-time { width:32px; text-align:center; font-size:11px; font-weight:700; color:#1a7abf; flex-shrink:0; }
  .fixture-upcoming-score { font-size:16px; font-weight:700; color:#1a7abf; text-align:right; flex-shrink:0; }
  .page-pad { padding:16px 12px 0; }

  /* 스쿼드 테이블 - FOTMOB 스타일 */
  .squad-group { margin-bottom:0; }
  .squad-group-title { font-size:12px; font-weight:700; color:var(--muted); padding:14px 14px 8px; text-transform:uppercase; letter-spacing:0.5px; border-top:1px solid var(--border); background:#f8f9fb; }
  .squad-group:first-child .squad-group-title { border-top:none; }
  .squad-table-header { display:grid; grid-template-columns:36px 1fr 40px 36px 36px 36px; gap:4px; padding:8px 14px; background:#f0f2f5; font-size:10px; color:var(--muted); font-weight:700; letter-spacing:0.3px; }
  .squad-row { display:grid; grid-template-columns:36px 1fr 40px 36px 36px 36px; gap:4px; padding:11px 14px; border-top:1px solid var(--border); align-items:center; background:#fff; transition:background 0.1s; }
  .squad-row:hover { background:#f8f9fb; }
  .squad-num { font-size:13px; font-weight:700; color:var(--muted); text-align:center; }
  .squad-name { font-size:13px; font-weight:600; color:#222831; display:flex; align-items:center; gap:6px; }
  .squad-status-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .squad-status-dot.injured { background:var(--lose); }
  .squad-status-dot.resting { background:var(--draw); }
  .squad-col { font-size:13px; font-weight:600; text-align:center; color:#222831; }
  .squad-col.blue { color:#1a7abf; font-size:15px; font-weight:700; }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <img class="logo-img" src="emblem_v4.png" alt="ATTACK FC">
    <div>
      <div class="logo-text">ATTACK F.C.</div>
      <div class="logo-sub">2026 시즌</div>
    </div>
  </div>
</header>

<div class="team-tab-bar" id="team-tab-bar">
  <button class="team-tab active" onclick="switchTeamTab('overview',this)">팀 개요</button>
  <button class="team-tab" onclick="switchTeamTab('matches',this)">경기</button>
  <button class="team-tab" onclick="switchTeamTab('scorers',this)">득점 순위</button>
  <button class="team-tab" onclick="switchTeamTab('squad',this)">스쿼드</button>
</div>

<main>

  <!-- 팀 섹션 -->
  <div class="section active" id="home">

    <!-- 팀 개요 -->
    <div class="tab-section active" id="tab-overview">
      <div class="team-hero">
        <div class="hero-main">
          <img class="hero-emblem" src="emblem_v4.png" alt="ATTACK FC">
          <div class="hero-info">
            <div class="team-name">ATTACK F.C.</div>
            <div class="team-sub">창단 2006 · 안산시</div>
          </div>
        </div>
      </div>

      <div class="loading" id="overview-loading"><div class="spinner"></div>불러오는 중...</div>
      <div id="overview-content" style="display:none">
        <div class="content-wrap">

          <!-- 다음 경기 -->
          <div id="next-match-section" style="display:none">
            <div class="next-match-label">다음 경기</div>
            <div class="next-match-card" id="next-match-card"></div>
            <div class="divider"></div>
          </div>

          <!-- 팀 기록 -->
          <div class="sec-header"><div class="sec-title">팀 기록</div></div>
          <div class="form-strip" id="form-strip"></div>
          <div class="divider"></div>

          <!-- 시즌 통계 -->
          <div class="sec-header"><div class="sec-title">시즌 통계</div></div>
          <div class="stats-summary-card">
            <div class="stats-summary-row">
              <div class="stats-summary-item"><div class="s-val" id="ov-games">-</div><div class="s-lbl">경기</div></div>
              <div class="stats-summary-item highlight"><div class="s-val" id="ov-goals">-</div><div class="s-lbl">득점</div></div>
              <div class="stats-summary-item"><div class="s-val" id="ov-concede">-</div><div class="s-lbl">실점</div></div>
              <div class="stats-summary-item"><div class="s-val" id="ov-gd">-</div><div class="s-lbl">득실차</div></div>
            </div>
            <div class="wdl-bar-wrap">
              <div class="wdl-bar-labels"><span class="wdl-bar-label">승</span><span class="wdl-bar-label">무</span><span class="wdl-bar-label">패</span></div>
              <div class="wdl-bar" id="wdl-bar"></div>
              <div class="wdl-bar-nums">
                <span class="wdl-num w" id="ov-wins">-</span>
                <span class="wdl-num d" id="ov-draws">-</span>
                <span class="wdl-num l" id="ov-loses">-</span>
              </div>
            </div>
          </div>
          <div class="divider"></div>

          <!-- 득점 순위 TOP3 -->
          <div class="sec-header">
            <div class="sec-title">득점 순위</div>
            <button class="sec-more" onclick="switchTeamTab('scorers',document.querySelectorAll('.team-tab')[2])">모두</button>
          </div>
          <div class="rank-list" id="ov-goals-list"></div>

          <div class="sec-header">
            <div class="sec-title">어시스트 순위</div>
            <button class="sec-more" onclick="switchTeamTab('scorers',document.querySelectorAll('.team-tab')[2])">모두</button>
          </div>
          <div class="rank-list" id="ov-assists-list"></div>

          <div class="sec-header">
            <div class="sec-title">MOM 순위</div>
            <button class="sec-more" onclick="switchTeamTab('scorers',document.querySelectorAll('.team-tab')[2])">모두</button>
          </div>
          <div class="rank-list" id="ov-mom-list"></div>

        </div>
      </div>
    </div>

    <!-- 경기 기록 -->
    <div class="tab-section" id="tab-matches">
      <div class="loading" id="matches-loading2"><div class="spinner"></div>불러오는 중...</div>
      <div id="matches-list2"></div>
    </div>

    <!-- 득점 순위 -->
    <div class="tab-section" id="tab-scorers">
      <div class="loading" id="scorers-loading"><div class="spinner"></div>불러오는 중...</div>
      <div id="scorers-content" style="display:none" class="content-wrap">
        <div class="tab-row">
          <button class="tab-btn active" onclick="switchStatTab('goals',this)">골</button>
          <button class="tab-btn" onclick="switchStatTab('assists',this)">어시스트</button>
          <button class="tab-btn" onclick="switchStatTab('points',this)">공격포인트</button>
          <button class="tab-btn" onclick="switchStatTab('mom',this)">MOM</button>
        </div>
        <div class="full-table">
          <div class="full-table-header">
            <div>#</div><div>선수</div>
            <div style="text-align:center">G</div>
            <div style="text-align:center">A</div>
            <div style="text-align:center">포인트</div>
            <div style="text-align:center">MOM</div>
          </div>
          <div id="stats-list"></div>
        </div>
      </div>
    </div>

    <!-- 선수단 -->
    <div class="tab-section" id="tab-squad">
      <div class="loading" id="squad-loading"><div class="spinner"></div>불러오는 중...</div>
      <div id="squad-content" style="display:none"><div id="squad-list" class="content-wrap" style="padding-top:12px"></div></div>
    </div>

  </div>

</main>

</div>

<script>
const SUPA_URL = 'https://fboqjlzgyfewgsoxclxy.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZib3FqbHpneWZld2dzb3hjbHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3ODQ4MzIsImV4cCI6MjA5MzM2MDgzMn0.x4ima7dIQRP6q9nmCyWi0DIOOA3ZmSorjX-gE3lthiU';

async function api(path) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, { headers:{ 'apikey':SUPA_KEY, 'Authorization':`Bearer ${SUPA_KEY}` } });
  return r.json();
}

let allStats = [];
const tabLoaded = {};

function rankItem(p, i, key, label) {
  const cls = ['p1','p2','p3'][i]||'';
  return `<div class="rank-item">
    <div class="rank-pos ${cls}">${i+1}</div>
    <div class="rank-avatar">${p.name.slice(0,1)}</div>
    <div class="rank-info">
      <div class="rank-name">${p.name}</div>
      <div class="rank-sub">#${p.number||'-'}</div>
    </div>
    <div>
      <div class="rank-val">${p[key]}</div>
      <div class="rank-val-label">${label}</div>
    </div>
  </div>`;
}

async function loadOverview() {
  const [summary, stats, matches, upcoming] = await Promise.all([
    api('view_season_summary?select=*'),
    api('view_season_stats?select=*'),
    api('view_match_results?select=*&order=match_date.desc&limit=8'),
    api('matches?select=*&status=eq.upcoming&order=match_date.asc&limit=1')
  ]);
  allStats = stats;
  const s = summary[0];

  // 다음 경기
  if (upcoming && upcoming.length > 0) {
    const u = upcoming[0];
    const d = new Date(u.match_date);
    const dateStr = `${d.getMonth()+1}월 ${d.getDate()}일`;
    document.getElementById('next-match-card').innerHTML = `
      <div class="next-match-league">📅 예정 경기</div>
      <div class="next-match-body">
        <div class="next-team">
          <div class="next-team-emblem"><img src="emblem_v4.png" style="width:36px;height:36px;border-radius:50%;object-fit:cover"></div>
          <div class="next-team-name">ATTACK F.C.</div>
        </div>
        <div class="next-match-center">
          <div class="next-match-time">${u.match_time||''}</div>
          <div class="next-match-date">${dateStr}</div>
        </div>
        <div class="next-team">
          <div class="next-team-emblem">⚽</div>
          <div class="next-team-name">${u.opponent}</div>
        </div>
      </div>
      <div class="next-match-ground">📍 ${u.ground||'미정'}</div>`;
    document.getElementById('next-match-section').style.display = 'block';
  }

  // 시즌 통계
  document.getElementById('ov-games').textContent = s.총경기수;
  document.getElementById('ov-goals').textContent = s.총득점;
  document.getElementById('ov-concede').textContent = s.총실점;
  const gd = s.득실차;
  document.getElementById('ov-gd').textContent = gd > 0 ? `+${gd}` : gd;
  document.getElementById('ov-wins').textContent = s.승;
  document.getElementById('ov-draws').textContent = s.무;
  document.getElementById('ov-loses').textContent = s.패;

  const total = s.총경기수 || 1;
  const wp = (s.승/total*100).toFixed(1);
  const dp = (s.무/total*100).toFixed(1);
  const lp = (100-parseFloat(wp)-parseFloat(dp)).toFixed(1);
  document.getElementById('wdl-bar').innerHTML = `
    <div class="w-bar" style="width:${wp}%"></div>
    <div class="d-bar" style="width:${dp}%"></div>
    <div class="l-bar" style="width:${lp}%"></div>`;

  // 폼 카드 (finished 경기만)
  const finishedMatches = matches.filter(m => m.result !== null);
  document.getElementById('form-strip').innerHTML = finishedMatches.map(m => {
    const rc = m.result==='Win'?'win':m.result==='Lose'?'lose':'draw';
    const rlKo = m.result==='Win'?'승':m.result==='Lose'?'패':'무';
    const opp = m.opponent.length > 6 ? m.opponent.slice(0,6)+'…' : m.opponent;
    return `<div class="form-card">
      <div class="form-card-score">
        <div class="score-txt">${m.our_score}:${m.opponent_score}</div>
        <div class="opp-txt">${opp}</div>
      </div>
      <div class="form-card-result ${rc}">${rlKo}</div>
    </div>`;
  }).join('');

  // TOP3
  const topG = [...stats].sort((a,b)=>b['총골']-a['총골']).slice(0,3);
  document.getElementById('ov-goals-list').innerHTML = topG.map((p,i)=>rankItem(p,i,'총골','골')).join('');
  const topA = [...stats].sort((a,b)=>b['총어시스트']-a['총어시스트']).slice(0,3);
  document.getElementById('ov-assists-list').innerHTML = topA.map((p,i)=>rankItem(p,i,'총어시스트','어시스트')).join('');
  const topM = [...stats].sort((a,b)=>b['mom횟수']-a['mom횟수']).filter(p=>p['mom횟수']>0).slice(0,3);
  document.getElementById('ov-mom-list').innerHTML = topM.map((p,i)=>rankItem(p,i,'mom횟수','MOM')).join('');

  document.getElementById('overview-loading').style.display='none';
  document.getElementById('overview-content').style.display='block';
}

async function loadMatchesTab() {
  let finished = [], upcoming = [];
  try {
    const results = await Promise.all([
      api('matches?select=*&status=eq.finished&order=match_date.desc'),
      api('matches?select=*&status=eq.upcoming&order=match_date.asc')
    ]);
    finished = Array.isArray(results[0]) ? results[0] : [];
    upcoming = Array.isArray(results[1]) ? results[1] : [];
  } catch(e) {
    document.getElementById('matches-list2').innerHTML = '<p style="padding:20px;color:#888">데이터를 불러올 수 없습니다.</p>';
    document.getElementById('matches-loading2').style.display='none';
    return;
  }

  let html = '';

  // 예정 경기
  if (upcoming && upcoming.length > 0) {
    html += '<div class="match-group">';
    html += '<div class="match-group-date">예정 경기</div>';
    upcoming.forEach(m => {
      const d = new Date(m.match_date);
      const dateStr = `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}`;
      html += `<div class="fixture-upcoming">
        <div class="fixture-upcoming-time">VS</div>
        <div class="fixture-info">
          <div class="fixture-teams">
            <span class="fixture-team-name">${m.opponent}</span>
          </div>
          <div class="fixture-ground">📅 ${dateStr}${m.match_time ? ' · ' + m.match_time : ''} · 📍 ${m.ground||'미정'}</div>
        </div>
        <div class="fixture-upcoming-score">예정</div>
      </div>`;
    });
    html += '</div>';
  }

  // 지난 경기 - 월별 그룹핑
  const groups = {};
  finished.forEach(m => {
    const d = new Date(m.match_date);
    const key = `${d.getFullYear()}년 ${d.getMonth()+1}월`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(m);
  });

  Object.entries(groups).forEach(([month, matches]) => {
    html += `<div class="match-group">`;
    html += `<div class="match-group-date">${month}</div>`;
    matches.forEach(m => {
      const rc = m.result==='Win'?'win':m.result==='Lose'?'lose':'draw';
      const rl = m.result==='Win'?'W':m.result==='Lose'?'L':'D';
      const d = new Date(m.match_date);
      const dateStr = `${d.getMonth()+1}. ${d.getDate()}`;
      html += `<div class="fixture-card">
        <div class="fixture-result-badge ${rc}">${rl}</div>
        <div class="fixture-info">
          <div class="fixture-teams">
            <span class="fixture-team-name">ATTACK F.C.</span>
            <span class="fixture-vs">vs</span>
            <span class="fixture-team-name">${m.opponent}</span>
          </div>
          <div class="fixture-ground">📅 ${dateStr} · 📍 ${m.ground||'미정'}</div>
        </div>
        <div class="fixture-score ${rc}">${m.our_score} : ${m.opponent_score}</div>
      </div>`;
    });
    html += '</div>';
  });

  document.getElementById('matches-list2').innerHTML = html;
  document.getElementById('matches-loading2').style.display='none';
}

async function loadScorersTab() {
  if (!allStats.length) allStats = await api('view_season_stats?select=*');
  renderStatsTable('goals');
  document.getElementById('scorers-loading').style.display='none';
  document.getElementById('scorers-content').style.display='block';
}

function renderStatsTable(tab) {
  let sorted = [...allStats].sort((a,b) =>
    tab==='goals' ? b['총골']-a['총골'] :
    tab==='assists' ? b['총어시스트']-a['총어시스트'] :
    tab==='points' ? b['공격포인트']-a['공격포인트'] :
    b['mom횟수']-a['mom횟수']
  );
  if (tab==='goals') sorted = sorted.filter(p=>p['총골']>0);
  if (tab==='assists') sorted = sorted.filter(p=>p['총어시스트']>0);
  if (tab==='points') sorted = sorted.filter(p=>p['공격포인트']>0);
  if (tab==='mom') sorted = sorted.filter(p=>p['mom횟수']>0);

  const el = document.getElementById('stats-list');

  if (tab === 'mom') {
    el.innerHTML = sorted.map((p,i) => {
      const cls = ['p1','p2','p3'][i]||'';
      const stars = '⭐'.repeat(p['mom횟수']);
      return `<div class="rank-item" style="border-top:1px solid var(--border)">
        <div class="rank-pos ${cls}">${i+1}</div>
        <div class="rank-avatar">${p.name.slice(0,1)}</div>
        <div class="rank-info">
          <div class="rank-name">${p.name} <span style="font-size:11px;color:var(--muted)">#${p.number||'-'}</span></div>
          <div style="font-size:13px;margin-top:3px;letter-spacing:1px">${stars}</div>
        </div>
        <div>
          <div style="font-size:26px;font-weight:800;color:#f5a623;text-align:right">${p['mom횟수']}</div>
          <div style="font-size:10px;color:var(--muted);text-align:right">MOM</div>
        </div>
      </div>`;
    }).join('');
    // full-table을 rank-list처럼 보이게
    document.querySelector('.full-table').style.borderRadius = '10px';
    document.querySelector('.full-table-header').style.display = 'none';
  } else {
    document.querySelector('.full-table-header').style.display = '';
    el.innerHTML = sorted.map((p,i) => {
      const cls = ['p1','p2','p3'][i]||'';
      return `<div class="full-table-row">
        <div class="rank-pos ${cls}" style="font-size:12px">${i+1}</div>
        <div class="col-name">${p.name}</div>
        <div class="col-num ${tab==='goals'?'highlight':''}">${p['총골']}</div>
        <div class="col-num ${tab==='assists'?'highlight':''}">${p['총어시스트']}</div>
        <div class="col-num ${tab==='points'?'highlight':''}">${p['공격포인트']}</div>
        <div class="col-num">${p['mom횟수']>0?`<span class="mom-tag">${p['mom횟수']}</span>`:'-'}</div>
      </div>`;
    }).join('');
  }
}

function switchStatTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderStatsTable(tab);
}

async function loadSquadTab() {
  const players = await api('players?select=*&order=number.asc');
  if (!allStats.length) allStats = await api('view_season_stats?select=*');
  const sm = {};
  allStats.forEach(s => sm[s.name]=s);

  const posOrder = ['GK','DF','MF','FW'];
  const posLabel = { GK:'골키퍼', DF:'수비수', MF:'미드필더', FW:'공격수' };
  const groups = { GK:[], DF:[], MF:[], FW:[], etc:[] };

  players.forEach(p => {
    const pos = p.position;
    if (pos && groups[pos]) groups[pos].push(p);
    else groups.etc.push(p);
  });

  let html = '<div style="background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;">';

  // 테이블 헤더
  html += `<div class="squad-table-header">
    <div style="text-align:center">#</div>
    <div>이름</div>
    <div style="text-align:center">상태</div>
    <div style="text-align:center">G</div>
    <div style="text-align:center">A</div>
    <div style="text-align:center">MOM</div>
  </div>`;

  posOrder.forEach(pos => {
    if (groups[pos].length === 0) return;
    html += `<div class="squad-group">`;
    html += `<div class="squad-group-title">${posLabel[pos]}</div>`;
    groups[pos].forEach(p => {
      const s = sm[p.name] || {};
      const st = p.status || 'active';
      const stLabel = { active:'-', injured:'부상', resting:'휴식' };
      const stDot = st !== 'active' ? `<span class="squad-status-dot ${st}"></span>` : '';
      html += `<div class="squad-row">
        <div class="squad-num">${p.number}</div>
        <div class="squad-name">${stDot}${p.name}</div>
        <div class="squad-col" style="font-size:11px;color:${st==='injured'?'var(--lose)':st==='resting'?'var(--draw)':'var(--muted)'}">${stLabel[st]}</div>
        <div class="squad-col">${s['총골']||0}</div>
        <div class="squad-col">${s['총어시스트']||0}</div>
        <div class="squad-col ${s['mom횟수']>0?'blue':''}">${s['mom횟수']||0}</div>
      </div>`;
    });
    html += '</div>';
  });

  // 포지션 미지정
  if (groups.etc.length > 0) {
    html += `<div class="squad-group">`;
    html += `<div class="squad-group-title">기타</div>`;
    groups.etc.forEach(p => {
      const s = sm[p.name] || {};
      const st = p.status || 'active';
      const stLabel = { active:'-', injured:'부상', resting:'휴식' };
      const stDot = st !== 'active' ? `<span class="squad-status-dot ${st}"></span>` : '';
      html += `<div class="squad-row">
        <div class="squad-num">${p.number}</div>
        <div class="squad-name">${stDot}${p.name}</div>
        <div class="squad-col" style="font-size:11px;color:${st==='injured'?'var(--lose)':st==='resting'?'var(--draw)':'var(--muted)'}">${stLabel[st]}</div>
        <div class="squad-col">${s['총골']||0}</div>
        <div class="squad-col">${s['총어시스트']||0}</div>
        <div class="squad-col ${s['mom횟수']>0?'blue':''}">${s['mom횟수']||0}</div>
      </div>`;
    });
    html += '</div>';
  }

  html += '</div>';
  document.getElementById('squad-list').innerHTML = html;
  document.getElementById('squad-loading').style.display='none';
  document.getElementById('squad-content').style.display='block';
}

function switchTeamTab(tab, btn) {
  document.querySelectorAll('.team-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-section').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  if (!tabLoaded[tab]) {
    tabLoaded[tab]=true;
    if(tab==='matches') loadMatchesTab();
    if(tab==='scorers') loadScorersTab();
    if(tab==='squad') loadSquadTab();
  }
}

function showSection(id, e) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.bottom-nav button')[0].classList.add('active');
  document.getElementById('team-tab-bar').style.display='flex';
}

loadOverview();
tabLoaded['overview']=true;
</script>
